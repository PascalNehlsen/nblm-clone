name: guardrails

# The checks that exist before any app code does: no secrets in history, workflows
# without known injection or permission problems, and agent-guard behaving as tested.
# They are the first required status checks of the main ruleset.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Same version as .pre-commit-config.yaml. The checksum is pinned here, not
      # fetched from the release, so a swapped release asset fails the job.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      - name: Scan every commit
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .

  workflows:
    name: workflow audit (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned one minor behind the newest release on purpose: new releases wait
      # two weeks before they are adopted (dependency cooldown).
      - name: Audit workflows
        run: pipx run zizmor==1.30.1 --offline --min-severity low .github/workflows

  agent-guard:
    name: agent-guard tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Run hook tests
        run: node --test .claude/hooks/agent-guard.test.mjs
