name: guardrails

# The checks that exist before any app code does: no secrets in history, workflows
# without known injection or permission problems, and agent-guard behaving as tested.
# They are the first required status checks of the main ruleset.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Same script and pinned checksum as the pre-commit hook: one version for both.
      - name: Scan every commit
        run: scripts/gitleaks.sh git --config .gitleaks.toml --redact --no-banner --exit-code 1 .

  workflows:
    name: workflow audit (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned one minor behind the newest release on purpose: new releases wait
      # two weeks before they are adopted (dependency cooldown).
      - name: Audit workflows
        run: pipx run zizmor==1.30.1 --offline --min-severity low .github/workflows

  agent-guard:
    name: agent-guard tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Run hook tests
        run: node --test .claude/hooks/agent-guard.test.mjs
