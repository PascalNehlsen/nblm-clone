name: ci

# Application checks on every PR and on main. No paths filter: once these jobs are
# required status checks, a filtered-out run would leave the check pending forever.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    # The name is the required status check context: renaming it leaves the ruleset
    # waiting for a check that never reports. Change both together.
    name: app (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version pinned in package.json (packageManager).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  db:
    # Also a required status check context once merged: rename together with the ruleset.
    name: db (pgTAP, RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Supabase CLI: no telemetry to PostHog, no update check.
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      SUPABASE_NO_UPDATE_NOTIFIER: "1"
      # Dummy, non-secret values: config.toml enables GitHub login through env(), and
      # nothing here talks to GitHub OAuth. Real values exist only on developer machines.
      SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID: ci-dummy-client-id
      SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET: ci-dummy-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install
        run: pnpm install --frozen-lockfile

      # Only Postgres, Auth (gotrue), PostgREST and the gateway (kong): what pgTAP and
      # the RLS matrix need. The CLI is the pinned devDependency, same as locally.
      - name: Start local Supabase
        run: pnpm exec supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: pgTAP catalog and policy tests
        run: pnpm test:db

      - name: RLS matrix with real JWTs
        run: pnpm test:rls

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
