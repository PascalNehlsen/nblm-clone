# Local gate before every commit. Install once: `pre-commit install`.
# The same checks run in CI (.github/workflows/guardrails.yml); this only makes them fail earlier.
# Hooks are pinned to commit SHAs; the tag is in the comment for humans and Dependabot-style updates.
minimum_pre_commit_version: "3.5.0"
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: ["--branch", "main"]
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-json
      - id: check-yaml
        # pnpm 12 (seen with 12.9.0) writes the lockfile as two YAML documents: its own
        # binary, then the dependencies. pnpm validates it on every `--frozen-lockfile` install.
        exclude: ^pnpm-lock\.yaml$
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: local
    hooks:
      # Release binary with a pinned checksum instead of the upstream hook, which
      # builds from Go source and would need proxy.golang.org (see the script).
      - id: gitleaks
        name: gitleaks (staged)
        language: system
        entry: scripts/gitleaks.sh git --pre-commit --staged --config=.gitleaks.toml --redact --no-banner --verbose
        pass_filenames: false
      - id: agent-guard-tests
        name: agent guard tests
        language: system
        entry: node --test .claude/hooks/agent-guard.test.mjs
        files: ^\.claude/hooks/
        pass_filenames: false
